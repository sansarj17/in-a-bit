# Local development infrastructure.
# Usage (from the repo root):  docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: in-a-bit-postgres
    environment:
      # Local-only credentials. Real deployments use their own DATABASE_URL.
      POSTGRES_USER: inabit
      POSTGRES_PASSWORD: inabit
      POSTGRES_DB: in_a_bit
    ports:
      # Bound to localhost only, and on 5433 so it doesn't clash with a locally installed Postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inabit -d in_a_bit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
